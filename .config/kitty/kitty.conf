#: Keys are identified simply by their lowercase unicode characters.
#: For example: ``a`` for the A key, ``[`` for the left square bracket
#: key, etc. For functional keys, such as ``Enter or Escape`` the
#: names are present at https://sw.kovidgoyal.net/kitty/keyboard-
#: protocol/#functional-key-definitions. For modifier keys, the names
#: are ctrl (control, ⌃), shift (⇧), alt (opt, option, ⌥), super (cmd,
#: command, ⌘). See also: GLFW mods
#: <https://www.glfw.org/docs/latest/group__mods.html>

#: On Linux you can also use XKB key names to bind keys that are not
#: supported by GLFW. See XKB keys
#: <https://github.com/xkbcommon/libxkbcommon/blob/master/include/xkbcommon/xkbcommon-
#: keysyms.h> for a list of key names. The name to use is the part
#: after the XKB_KEY_ prefix. Note that you can only use an XKB key
#: name for keys that are not known as GLFW keys.

#: Finally, you can use raw system key codes to map keys, again only
#: for keys that are not known as GLFW keys. To see the system key
#: code for a key, start kitty with the kitty --debug-input option.
#: Then kitty will output some debug text for every key event. In that
#: text look for ``native_code`` the value of that becomes the key
#: name in the shortcut. For example:

kitty_mod alt+shift
clear_all_shortcuts no
term xterm-kitty

map kitty_mod+c copy_to_clipboard
map kitty_mod+v paste_from_clipboard

map kitty_mod+equal       change_font_size all +1.0
map kitty_mod+plus        change_font_size all +1.0
map kitty_mod+kp_add      change_font_size all +1.0
map cmd+plus              change_font_size all +1.0
map cmd+equal             change_font_size all +1.0
map shift+cmd+equal       change_font_size all +1.0
map kitty_mod+minus       change_font_size all -1.0
map kitty_mod+kp_subtract change_font_size all -1.0
map cmd+minus             change_font_size all -1.0
map shift+cmd+minus       change_font_size all -1.0
map kitty_mod+backspace   change_font_size all 0
map cmd+0                 change_font_size all 0


#Select and act on visible text

#: Use the hints kitten to select text and either pass it to an
#: external program or insert it into the terminal or copy it to the
#: clipboard.

# Open a currently visible URL using the keyboard. The program used
# to open the URL is specified in open_url_with (terminal-url-opener)
map cmd+u open_url_with_hints
# open url directly in net-browser (firefox, chromium, whatever is set there)
map cmd+shift+u kitten hints --type url --program "firefox -P default"

# select path and paste at cursor position
map cmd+v>p kitten hints --type path --program -

# Insert selected line at cursor position
map cmd+v>l kitten hints --type line --program -

#: Insert selected word
map cmd+v>w kitten hints --type word --program -

#: Insert selected hash
map cmd+v>h kitten hints --type hash --program -

#: Insert selected url
map cmd+v>u kitten hints --type url --program -

# insert unicode (let's be honest, it's for inserting emojis only:))
map cmd+e    kitten unicode_input

#::  Reload kitty.conf, applying any changes since the last time it
#::  was loaded. Note that a handful of settings cannot be dynamically
#::  changed and require a full restart of kitty.  You can also map a
#::  keybinding to load a different config file, for example::

#::      map f5 load_config /path/to/alternative/kitty.conf
#: Reload kitty.conf
map kitty_mod+f5 load_config_file

#::  Note that all setting from the original kitty.conf are discarded,
#::  in other words the new conf settings *replace* the old ones.

#: Debug kitty configuration

map kitty_mod+f6 debug_config

map cmd+ctrl+l>a        send_text all (ノಠ益ಠ)ノ彡┻━┻
map cmd+ctrl+l>h        send_text all ( ͡° ͜ʖ ͡°)
map cmd+ctrl+l>s        send_text all ¯\_(ツ)_/¯
map cmd+ctrl+l>t        send_text all (╯°□°)╯︵ ┻━┻
map cmd+ctrl+l>shift+t  send_text all ┬─┬ノ(º_ºノ)
map cmd+ctrl+l>w        send_text all ヽ(͡◕ʖ◕)ﾉ
map cmd+ctrl+l>r        send_test all ᕕ( ᐛ )ᕗ
